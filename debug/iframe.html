<!DOCTYPE html>
<html>
<head>
    <title>Mapbox GL JS debug page</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="The map embedded three ways — a plain iframe, `sandbox=allow-scripts`, and a document built from a `blob:` URL — the embedding cases GL JS has to keep working.">
    <meta name="mapbox:role" content="env">
    <style>
        body { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
        p { margin: 0 0 4px; }
    </style>
</head>

<body>

<section>
    <p>plain iframe</p>
    <iframe width="600" height="450" src="default.html"></iframe>
</section>

<section>
    <p><code>sandbox="allow-scripts"</code></p>
    <iframe width="600" height="450" sandbox="allow-scripts" src="default.html"></iframe>
</section>

<section>
    <p><code>blob:</code> URL document</p>
    <iframe id="blob-frame" width="600" height="450"></iframe>
</section>

<script type="module">
import {getAccessToken} from './access_token_generated.js';

const js = document.createElement("a");
js.href = "../dist/esm-dev/mapbox-gl.js";
const css = document.createElement("a");
css.href = "../dist/mapbox-gl.css";
document.querySelector('#blob-frame').src = URL.createObjectURL(new Blob([ `
<!DOCTYPE html>
<html>
<head>
    <title>Mapbox GL JS debug page<\/title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="${css.href}" />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>

<body>
<div id="map"></div>
<script type="module">
import * as mapboxgl from '${js.href}';
var map = window.map = new mapboxgl.Map({
    accessToken: "${getAccessToken()}",
    container: 'map',
    devtools: true,
    zoom: 12.5,
    center: [-122.4194, 37.7749],
    hash: true
});

<\/script>
</body>
</html>
` ], {type: 'text/html'}));
</script>

</body>
</html>
