<!DOCTYPE html>
<html>
<head>
    <title>Global vs. default symbol placement</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Two synchronized maps side by side: default (legacy) symbol placement vs. `placementAlgorithm: 'global'`.">
    <meta name="mapbox:role" content="tool">
    <link rel="stylesheet" href="../dist/mapbox-gl.css" />
    <style>
        body { margin: 0; padding: 0; }
        html, body { height: 100%; }

        #container {
            display: flex;
            height: 100%;
        }

        .map-pane {
            position: relative;
            width: 50%;
            height: 100%;
        }

        .map {
            width: 100%;
            height: 100%;
        }

        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            pointer-events: none;
        }
    </style>
</head>

<body>
<div id="container">
    <div class="map-pane">
        <div id="map-default" class="map"></div>
        <div class="label">default</div>
    </div>
    <div class="map-pane">
        <div id="map-global" class="map"></div>
        <div class="label">global</div>
    </div>
</div>

<script type="module">
import * as mapboxgl from '../dist/esm-dev/mapbox-gl.js';
import {getAccessToken} from './access_token_generated.js';

const accessToken = getAccessToken();

const sharedOptions = {
    accessToken,
    devtools: true,
    zoom: 12.5,
    center: [-122.4194, 37.7749],
};

const defaultMap = window.defaultMap = new mapboxgl.Map({
    ...sharedOptions,
    container: 'map-default',
    placementAlgorithm: 'default',
});

const globalMap = window.globalMap = new mapboxgl.Map({
    ...sharedOptions,
    container: 'map-global',
    placementAlgorithm: 'global',
    hash: true
});

// Mirror camera changes both ways, guarding against feedback loops.
function syncCameras(a, b) {
    let active = null;

    function bind(source, target) {
        source.on('move', () => {
            if (active && active !== source) return;
            active = source;
            target.jumpTo({
                center: source.getCenter(),
                zoom: source.getZoom(),
                bearing: source.getBearing(),
                pitch: source.getPitch(),
            });
        });
        source.on('moveend', () => {
            if (active === source) active = null;
        });
    }

    bind(a, b);
    bind(b, a);
}

syncCameras(defaultMap, globalMap);
</script>
</body>
</html>
