<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Add support for right-to-left scripts</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="description" content="Arabic labels around Baghdad, shaped by the built-in RTL text support.">
    <meta name="mapbox:role" content="feature">
    <meta name="mapbox:in-release-testing" content="true">
    <link rel="stylesheet" href="../dist/mapbox-gl.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>

<body>
<div id="map"></div>

<script type="module">
import * as mapboxgl from '../dist/esm-dev/mapbox-gl.js';
import {getAccessToken} from './access_token_generated.js';

window.map = new mapboxgl.Map({
    accessToken: getAccessToken(),
    container: 'map',
    devtools: true,
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [44.3763, 33.2788],
    zoom: 11
});
</script>
</body>
</html>
